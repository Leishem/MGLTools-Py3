name: build-and-test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux-x86_64:
    uses: ./.github/workflows/build-one.yml
    with: { name: linux-x86_64, os: ubuntu-24.04, gui: xvfb }

  macos-arm64:
    uses: ./.github/workflows/build-one.yml
    with: { name: macos-arm64, os: macos-14, gui: native }

  windows-x64:
    uses: ./.github/workflows/build-one.yml
    with: { name: windows-x64, os: windows-2022, gui: mesa }
